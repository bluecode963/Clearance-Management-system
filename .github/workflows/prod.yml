name: Prod CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-compose:
    name: Build, test, and validate prod compose
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      JWT_SECRET: ci-jwt-secret-change-in-real-prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend
        working-directory: backend
        run: mvn clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate prod compose file
        run: docker compose -f docker-compose.prod.yml config

      - name: Build prod compose images
        run: docker compose -f docker-compose.prod.yml build

      - name: Start prod compose stack
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Show running prod containers
        run: docker compose -f docker-compose.prod.yml ps

      - name: Verify prod API through frontend proxy
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.prod.yml logs backend frontend
          exit 1

      - name: Verify prod frontend
        run: curl -fsS http://localhost

      - name: Stop prod compose stack
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
