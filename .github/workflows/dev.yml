name: Dev CI/CD

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build-test-compose:
    name: Build, test, and validate dev compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend
        working-directory: backend
        run: mvn clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate dev compose file
        run: docker compose -f docker-compose.dev.yml config

      - name: Build dev compose images
        run: docker compose -f docker-compose.dev.yml build

      - name: Start dev compose stack
        run: docker compose -f docker-compose.dev.yml up -d

      - name: Show running dev containers
        run: docker compose -f docker-compose.dev.yml ps

      - name: Verify dev backend health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.dev.yml logs backend
          exit 1

      - name: Verify dev frontend
        run: curl -fsS http://localhost:5173

      - name: Stop dev compose stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
