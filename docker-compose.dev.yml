services:
  postgres:
    image: postgres:16
    container_name: student-clearance-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-student_clearance}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-student_clearance}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    image: student-clearance-backend:dev
    container_name: student-clearance-backend-dev
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-student_clearance}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-student_clearance_docker_jwt_secret_key_2026}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      FILE_UPLOAD_DIR: /app/uploads
    volumes:
      - attachment_data_dev:/app/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: student-clearance-frontend:dev
    container_name: student-clearance-frontend-dev
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  postgres_data_dev:
  attachment_data_dev:
